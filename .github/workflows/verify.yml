name: Verify JavaCVE
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python run.py demo
      - run: python -m unittest discover -s tests -v
      - run: python run.py list --cwe CWE-22
      - run: python run.py report
      - run: python run.py split
  source-security:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python run.py all --cve CVE-2021-29425
      - run: python run.py batch-build data/batch-02 --cve CVE-2016-9177 --cve CVE-2013-7285 --timeout 600
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-security-evidence
          path: runs/
